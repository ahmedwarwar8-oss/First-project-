<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Physiq">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<title>Physiq</title>
<meta name="theme-color" content="#e8412c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f4f4f6;--card:#fff;--text:#111;--muted:#6b6b76;--accent:#e8412c;--line:#dcdce2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d10;--card:#1a1a20;--text:#f2f2f5;--muted:#9a9aa6;--line:#2c2c35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d10;--card:#1a1a20;--text:#f2f2f5;--muted:#9a9aa6;--line:#2c2c35;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:84px;min-height:100vh}
header{padding:16px 16px 8px}
h1{font-size:26px;margin:0}
.sub{color:var(--muted);font-size:13px}
main{padding:8px 16px;max-width:560px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--card);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.th img{-webkit-user-drag:none;pointer-events:none}
.pk.off{background:rgba(0,0,0,.25);border:2px solid #fff;box-sizing:border-box}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.picked{outline:3px solid var(--accent);outline-offset:-3px}
.th.dim img{opacity:.6}
.pk{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.pickbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn:disabled{opacity:.45}
.th span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;font-family:inherit;background:var(--accent);color:#fff;width:100%}
.btn.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:10.5px;font-family:inherit;padding:8px 0}
nav button.on{color:var(--accent)}
.cmp{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#000;touch-action:none;user-select:none;-webkit-user-select:none}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
#top{clip-path:inset(0 50% 0 0)}
.bar{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#fff;left:50%;box-shadow:0 0 6px rgba(0,0,0,.5)}
.knob{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.tag{position:absolute;top:10px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600}
.row{display:flex;gap:12px;margin:12px 0}
.row>*{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
select,input[type=text],input[type=date]{display:block;width:100%;min-width:0;max-width:100%;height:46px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-family:inherit}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet img{width:100%;max-height:46vh;object-fit:contain;border-radius:10px;background:#000}
.note{font-size:12px;color:var(--muted);margin-top:16px}
.wkbar{display:flex;align-items:center;justify-content:space-between;text-align:center;margin:8px 0}
.sm{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
h2{font-size:20px;margin:14px 0 8px}
.ex{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.ex h3{margin:0;font-size:16px}
.meta{font-size:12px;color:var(--muted);margin:2px 0 4px}
.hint{font-size:12px;color:var(--accent);margin:4px 0}
.set{display:flex;align-items:center;gap:8px;margin:6px 0}
.set span{width:44px;font-size:13px;color:var(--muted)}
.set input{flex:1;min-width:0;text-align:center}
.addset{margin-top:4px;padding:6px 12px;font-size:13px}
.exh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.swap{padding:4px 12px;font-size:12px}
.rmset{margin-left:6px;margin-top:4px;padding:6px 12px;font-size:13px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:0;border-bottom:1px solid var(--line);padding:12px;font-size:15px;font-family:inherit}
.gh{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;margin:12px 0 4px}
.legend{display:flex;gap:14px;font-size:12px;font-weight:600;margin-bottom:6px}
.prow{display:grid;grid-template-columns:.6fr 1.2fr 1.2fr 1.6fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prow:last-child{border-bottom:0}
.prow.ph{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.bwr{grid-template-columns:1fr 1.4fr auto;align-items:center}
.bwd{padding:4px 10px;font-size:12px}
nav button i{display:flex;justify-content:center;font-style:normal;margin-bottom:3px}
#gear{display:flex;align-items:center;justify-content:center;padding:0}
.days{display:flex;justify-content:space-between;gap:4px;margin-top:8px}
.dd{flex:1;text-align:center;border:0;background:none;color:var(--text);font-family:inherit;font-size:11px;font-weight:600;padding:0}
.dd b{display:block;width:36px;height:36px;line-height:32px;border-radius:50%;border:2px solid var(--line);margin:4px auto 0;font-size:10px}
.dd.pl b{border-color:var(--accent)}
.dd.dn b{background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px}
.dd.rs b{opacity:.45}
.dd.td span{color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat .v{font-size:22px;font-weight:700;margin:2px 0}
.stat .l{font-size:12px;color:var(--muted)}
.mv,.rmx{padding:4px 10px;font-size:12px}
.dlb{border:2px solid var(--accent)}
#cam{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#cam[hidden]{display:none!important}
.ctop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;gap:6px}
.cbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:18px;padding:7px 12px;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif}
.cbtn.on{background:var(--accent);border-color:var(--accent)}
.cbox{position:relative;width:100%;max-height:calc(100% - 190px);aspect-ratio:3/4;margin:0 auto;overflow:hidden;background:#111}
.cbox video,.cbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cbox.mir video,.cbox.mir #cprev{transform:scaleX(-1)}
#cgh{opacity:.35;pointer-events:none}
.cguide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cguide line{stroke:#7CFC9A;stroke-width:1.5;vector-effect:non-scaling-stroke}
.glab{position:absolute;left:8px;color:#7CFC9A;font:600 11px -apple-system,sans-serif;text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none}
.cbot[hidden],#cgh[hidden],#cprev[hidden],#cvid[hidden]{display:none}
.ccount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 96px -apple-system,sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.chint{font-size:12.5px;color:rgba(255,255,255,.75);text-align:center;padding:8px 20px 0}
.cbot{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 16px;margin-top:auto}
.shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.4) inset}
.shutter:disabled{opacity:.5}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;font-family:inherit;padding:9px 0;border-radius:9px}
.seg button.on{background:var(--accent);color:#fff}
.lg{display:flex;gap:14px;font-size:12px;font-weight:600;margin-bottom:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.bpr{grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.bpr span:nth-child(2){white-space:nowrap;font-size:13.5px}
.bpr[data-ed]{cursor:pointer}
.bpsel{background:var(--bg);border-radius:8px;margin:0 -6px;padding-left:6px;padding-right:6px}
.shead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 4px}
.shead h2{margin:0;font-size:28px}
.sgh{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:22px 16px 6px}
.sg{background:var(--card);border-radius:12px;overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:50px;padding:0 10px 0 14px;margin:0;border:0;background:none;color:var(--text);font-family:inherit;font-size:16px;text-align:left;position:relative;cursor:pointer}
.srow+.srow::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.srow:active{background:var(--line)}
.sl{display:flex;align-items:center;gap:12px}
.sic{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sv{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;white-space:nowrap}
.sgf{font-size:12.5px;color:var(--muted);margin:7px 16px 0;line-height:1.4}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:0 0 auto;display:block}
header{min-height:62px}
/* Home: fills one screen, scaling with its height (compact on small phones, roomier on tall ones) */
html{background:var(--bg)}
header{padding:10px 16px 4px;min-height:52px}
.logo{width:32px;height:32px}
body{min-height:0;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
.hm .ex{padding:clamp(8px,calc(3.6vh - 11px),20px) 14px;margin-bottom:clamp(7px,calc(2.2vh - 5px),16px)}
.hgr{display:flex;align-items:baseline;justify-content:space-between;margin:clamp(0px,calc(2vh - 11px),10px) 0 clamp(6px,calc(2.6vh - 8px),18px)}
.hgr h2{margin:0;font-size:clamp(20px,calc(4.4vh - 5px),30px)}
.hgr .sub{font-size:clamp(13px,1.9vh,15px)}
.htd{display:flex;align-items:center;justify-content:space-between;gap:12px}
.htd h3{font-size:clamp(17px,calc(3.4vh - 2px),24px);margin:2px 0}
.htd .btn{width:auto;padding:clamp(9px,calc(2.4vh - 4px),15px) 22px;flex:0 0 auto}
.hm .meta{margin:0;font-size:clamp(12px,1.75vh,14px)}
.hwt .exh b:first-child{font-size:clamp(16px,2.3vh,19px)}
.hwt .exh span>b{font-size:clamp(17px,calc(4vh - 5px),26px)}
.hwt .wbar{height:clamp(7px,calc(1.6vh - 2px),12px);margin:clamp(7px,calc(2.4vh - 6px),15px) 0}
.hm .wbtns .chip{padding:clamp(6px,calc(2.3vh - 7px),13px) 0;font-size:clamp(13px,1.95vh,16px)}
.hm .exh>b{font-size:clamp(16px,2.3vh,19px)}
.hm .days{margin-top:clamp(5px,calc(2vh - 6px),13px)}
.hm .dd{font-size:clamp(11px,1.6vh,13px)}
.hm .dd b{width:clamp(30px,calc(6.4vh - 7px),46px);height:clamp(30px,calc(6.4vh - 7px),46px);line-height:normal;display:flex;align-items:center;justify-content:center;margin-top:4px}
.hm .stats{grid-template-columns:1fr 1fr 1fr;gap:clamp(8px,1.4vh,12px)}
.hm .stat{padding:clamp(8px,calc(3.2vh - 10px),18px) 12px}
.hm .stat .v{font-size:clamp(19px,calc(4.4vh - 6px),30px);margin:2px 0}
.hm .stat .v small{font-size:12px;font-weight:600}
.hm .stat .l{font-size:clamp(11.5px,1.7vh,13.5px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0}
.wbar div{height:100%;background:#2b8fd6;border-radius:6px;transition:width .3s}
.wbtns{display:flex;gap:8px}
.wbtns .chip{flex:1;text-align:center}
.chip:disabled{opacity:.4}
.shd{position:sticky;top:-16px;margin:-16px -16px 0;padding:16px 16px 8px;background:var(--bg);z-index:1}
.shr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.shr h2{margin:0}
</style>
</head>
<body>
<header style="display:flex;align-items:center;justify-content:space-between"><div class="brand"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#e8412c"/><path fill="#fff" d="M30 22H55.5A17.5 17.5 0 0 1 55.5 57H44V78H30Z"/><path fill="#e8412c" d="M44 33H55A6.5 6.5 0 0 1 55 46H44Z"/></svg><h1>Physiq</h1></div><button class="sm" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
<main id="main"></main>
<nav><button id="t-home"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></i>Home</button><button id="t-wk"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></i>Workouts</button><button id="t-stats"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg></i>Stats</button><button id="t-gal"><i><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="3.5"/></svg></i>Photos</button></nav>
<input type="file" id="file" accept="image/*" multiple style="position:fixed;left:-9999px;opacity:0">
<input type="file" id="rfile" style="position:fixed;left:-9999px;opacity:0">
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="cam" hidden>
  <div class="ctop"><button class="cbtn" id="cx">Close</button><div style="display:flex;gap:6px"><button class="cbtn" id="cghost">Ghost</button><button class="cbtn" id="ctimer">Timer</button><button class="cbtn" id="cflip">Flip</button></div></div>
  <div class="cbox" id="cbox"><video id="cvid" playsinline muted autoplay></video><img id="cgh" alt=""><img id="cprev" alt="" hidden>
    <svg class="cguide" id="cguide" viewBox="0 0 300 400" preserveAspectRatio="none"><line x1="0" y1="36" x2="300" y2="36"/><line x1="0" y1="378" x2="300" y2="378"/><line x1="150" y1="0" x2="150" y2="400" stroke-dasharray="6 8"/></svg><span class="glab" style="top:calc(9% - 18px)">Top of head</span><span class="glab" style="top:calc(94.5% + 3px)">Feet</span>
    <div class="ccount" id="ccount"></div></div>
  <div class="chint" id="chint">Line up your head and feet with the guides, and your body with the ghost photo.</div>
  <div class="cbot" id="cbot"><button class="shutter" id="cshot" aria-label="Take photo"></button></div>
  <div class="cbot" id="cdone" hidden><button class="btn alt" id="cre">Retake</button><button class="btn" id="csave">Save photo</button></div>
</div>

<script>
// ---------- storage (IndexedDB, with in-memory fallback) ----------
let ok=false, db=null, mem=[], photos=[], urls=[];
function openDB(){return new Promise(res=>{try{
  const r=indexedDB.open("progress-photos",2);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("p"))d.createObjectStore("p",{keyPath:"id"});if(!d.objectStoreNames.contains("w"))d.createObjectStore("w",{keyPath:"k"})};
  r.onsuccess=()=>{db=r.result;try{const t=db.transaction("p","readwrite");t.objectStore("p").put({id:-1});t.objectStore("p").delete(-1);t.oncomplete=()=>{ok=true;res()};t.onerror=t.onabort=()=>{db=null;res()}}catch(e){db=null;res()}};r.onerror=()=>res();setTimeout(res,3000);
}catch(e){res()}})}
function tx(mode){return db.transaction("p",mode).objectStore("p")}
function pAll(){return new Promise(res=>{if(!db)return res(mem.slice());const q=tx("readonly").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})}
function pPut(o){return new Promise(res=>{if(!db){mem=mem.filter(x=>x.id!==o.id);mem.push(o);return res()}const q=tx("readwrite").put(o);q.onsuccess=q.onerror=()=>res()})}
function pDel(id){return new Promise(res=>{if(!db){mem=mem.filter(x=>x.id!==id);return res()}const q=tx("readwrite").delete(id);q.onsuccess=q.onerror=()=>res()})}

// ---------- helpers ----------
const $=s=>document.querySelector(s);
let view="home", selA=null, selB=null, pos=50, pick=null, del=null, lpAt=0;
const fmt=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"2-digit"})}catch(e){return d}};
const today=()=>new Date().toISOString().slice(0,10);
const urlOf=p=>p.data;
const nm=p=>(p.label?p.label+" · ":"")+fmt(p.date);

function shrink(file){return new Promise((res,rej)=>{
  const im=new Image(),fr=new FileReader();fr.onerror=()=>rej();fr.onload=()=>{im.src=fr.result};fr.readAsDataURL(file);
  im.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL("image/jpeg",.85))};
  im.onerror=()=>rej()})}

async function load(){
  photos=(await pAll()).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
  if(!photos.find(p=>p.id===selA))selA=photos.length?photos[0].id:null;
  if(!photos.find(p=>p.id===selB))selB=photos.length?photos[photos.length-1].id:null;
  render();
}

// ---------- rendering ----------
function render(){
  urls.forEach(URL.revokeObjectURL);urls=[];
  $("#gear").style.visibility=view==="home"?"visible":"hidden";
  $("#t-gal").className=view==="gal"||view==="cmp"?"on":"";$("#t-home").className=view==="home"?"on":"";$("#t-wk").className=view==="wk"?"on":"";$("#t-stats").className=view==="prog"||view==="bw"||view==="bp"?"on":"";
  const m=$("#main");if(view==="wk"){renderWk(m);return}if(view==="prog"){renderProg(m);return}if(view==="bw"){renderBw(m);return}if(view==="bp"){renderBp(m);return}if(view==="home"){renderHome(m);return}if(view==="settings"){renderSettings(m);return}if(view==="editex"){renderEditEx(m);return}if(view==="setup"){renderSetup(m);return}
  if(view!=="gal"){pick=null;del=null}
  if(view==="gal"){
    const picking=!!pick,deleting=!!del,warn=ok?"":`<div class="note" style="color:var(--accent);margin:0 0 10px">This browser is blocking local storage, so photos will disappear when you close the app. Try opening the link directly in Safari rather than inside another app.</div>`;
    const top=deleting
      ?`<div class="ex pickbar"><div><b>${del.length} selected</b><div class="meta">Tap photos to select or unselect</div></div><div style="display:flex;gap:6px"><button class="chip" id="dall">${del.length===photos.length?"Clear":"Select all"}</button><button class="chip" id="dcx">Cancel</button></div></div>
        <button class="btn del" id="dgo" ${del.length?"":"disabled"} style="margin-bottom:12px">Delete ${del.length||""} photo${del.length===1?"":"s"}</button>`
      :picking
      ?`<div class="ex pickbar"><div><b>Select 2 photos</b><div class="meta">${pick.length}/2 selected · older photo goes on the left</div></div><button class="chip" id="pcx">Cancel</button></div>
        <button class="btn" id="pgo" ${pick.length===2?"":"disabled"} style="margin-bottom:12px">Compare selected</button>`
      :`<div class="row" style="margin:8px 0 ${photos.length>=2?"8px":"12px"}"><button class="btn" id="pcam">Take photo</button><label class="btn alt" for="file" style="display:block;text-align:center">Add from library</label></div>${photos.length>=2?`<button class="btn alt" id="psel" style="margin-bottom:12px">Select to compare</button>`:""}`;
    m.innerHTML=warn+top+
    (photos.length?`<div class="grid">${photos.map(p=>{
      if(deleting){const on=del.includes(p.id);return `<div class="th ${on?"picked":"dim"}" data-id="${p.id}"><img src="${urlOf(p)}" alt="">${on?`<b class="pk">✓</b>`:`<b class="pk off"></b>`}<span>${nm(p)}</span></div>`}
      const i=picking?pick.indexOf(p.id):-1;
      return `<div class="th ${i>=0?"picked":""} ${picking&&i<0?"dim":""}" data-id="${p.id}"><img src="${urlOf(p)}" alt="">${i>=0?`<b class="pk">${i+1}</b>`:""}<span>${nm(p)}</span></div>`}).join("")}</div>`
    :`<div class="empty">No photos yet.<br>Add your first weekly photo to get started.</div>`)+
    (picking||deleting?"":`<p class="note">Tip: hold down on a photo to select several and delete them at once. Keep the same pose, lighting and distance each week. Photos are saved in this browser’s storage on your iPhone. Clearing Safari website data or deleting the Home Screen app can erase them.</p>`);
    m.querySelectorAll(".th").forEach(e=>{const id=+e.dataset.id;let t=null,sx=0,sy=0,held=false;
      e.onpointerdown=ev=>{held=false;sx=ev.clientX;sy=ev.clientY;if(pick)return;clearTimeout(t);
        t=setTimeout(()=>{held=true;lpAt=Date.now();if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
          if(!del)del=[];if(!del.includes(id))del.push(id);render()},500)};
      e.onpointermove=ev=>{if(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10)clearTimeout(t)};
      e.onpointerup=e.onpointercancel=e.onpointerleave=()=>clearTimeout(t);
      e.oncontextmenu=ev=>ev.preventDefault();
      e.onclick=()=>{if(held||Date.now()-lpAt<700){held=false;return}
        if(del){const i=del.indexOf(id);if(i>=0)del.splice(i,1);else del.push(id);render();return}
        if(!pick)return openSheet(id);
        const i=pick.indexOf(id);if(i>=0)pick.splice(i,1);else{if(pick.length===2)pick.shift();pick.push(id)}render()}});
    if($("#dcx"))$("#dcx").onclick=()=>{del=null;render()};
    if($("#dall"))$("#dall").onclick=()=>{del=del.length===photos.length?[]:photos.map(p=>p.id);render()};
    if($("#dgo"))$("#dgo").onclick=async()=>{const b=$("#dgo");
      if(!b.dataset.a){b.dataset.a=1;b.textContent=`Tap again to delete ${del.length} photo${del.length===1?"":"s"}`;b.style.background="var(--accent)";b.style.color="#fff";return}
      b.disabled=true;b.textContent="Deleting…";for(const id of del)await pDel(id);del=null;load()};
    if($("#pcam"))$("#pcam").onclick=openCam;
    if($("#psel"))$("#psel").onclick=()=>{pick=[];render()};
    if($("#pcx"))$("#pcx").onclick=()=>{pick=null;render()};
    if($("#pgo"))$("#pgo").onclick=()=>{const [x,y]=pick.map(id=>photos.find(p=>p.id===id)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
      selA=x.id;selB=y.id;pick=null;view="cmp";render()};
  }else{
    if(photos.length<2){view="gal";render();return}
    const a=photos.find(p=>p.id===selA),b=photos.find(p=>p.id===selB);
    m.innerHTML=`<div class="shr" style="margin:4px 0 12px"><button class="chip" id="cback">‹ Back</button><h2>Compare</h2></div><div class="cmp" id="cmp">
      <img id="base" src="${urlOf(b)}" alt=""><img id="top" src="${urlOf(a)}" alt="">
      <div class="tag" style="left:10px" id="tagA">${nm(a)}</div><div class="tag" style="right:10px" id="tagB">${nm(b)}</div>
      <div class="bar" id="bar"><div class="knob">⇆</div></div></div>
      <div class="row"><button class="btn alt" id="swap">Swap sides</button><button class="btn" id="cnew">Pick other photos</button></div>`;
    $("#cback").onclick=()=>{view="gal";render()};
    $("#cnew").onclick=()=>{view="gal";pick=[];render()};
    $("#swap").onclick=()=>{[selA,selB]=[selB,selA];render()};
    setPos(pos);
    const box=$("#cmp");let drag=false;
    const mv=e=>{const r=box.getBoundingClientRect();setPos(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)))};
    box.onpointerdown=e=>{drag=true;box.setPointerCapture(e.pointerId);mv(e)};
    box.onpointermove=e=>{if(drag)mv(e)};
    box.onpointerup=box.onpointercancel=()=>drag=false;
  }
}
function setPos(p){pos=p;const t=$("#top"),b=$("#bar");if(!t)return;t.style.clipPath=`inset(0 ${100-p}% 0 0)`;b.style.left=p+"%"}

function openSheet(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  $("#sheet").innerHTML=`<img src="${urlOf(p)}" alt="">
    <div class="row"><div style="flex:1"><label>Label</label><input type="text" id="lb" value="${(p.label||"").replace(/"/g,"&quot;")}" placeholder="e.g. Week 4"></div>
    <div style="flex:1"><label>Date</label><input type="date" id="dt" value="${p.date}"></div></div>
    <div class="row"><button class="btn" id="sv">Save</button></div>
    <div class="row"><button class="btn del" id="dl">Delete photo</button></div>
    <div class="row"><button class="btn alt" id="cl">Close</button></div>`;
  $("#modal").classList.add("on");
  const close=()=>{$("#modal").classList.remove("on")};
  $("#cl").onclick=close;
  $("#sv").onclick=async()=>{p.label=$("#lb").value.trim();p.date=$("#dt").value||p.date;await pPut(p);close();load()};
  let armed=false;$("#dl").onclick=async()=>{if(!armed){armed=true;$("#dl").textContent="Tap again to confirm delete";$("#dl").style.background="var(--accent)";$("#dl").style.color="#fff";return}await pDel(id);close();load()};
}
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("on")};

// Mesocycles: 12 training weeks, then 1 deload week (13-week cycle). wkWeek is a running week count.
const MESO=12,CYC=MESO+1,mesoOf=w=>Math.floor((w-1)/CYC)+1,posOf=w=>(w-1)%CYC+1,isDeload=w=>posOf(w)===CYC;
const wkLabel=w=>isDeload(w)?"Deload week":`Week ${posOf(w)} of ${MESO}`;
const wkShort=w=>isDeload(w)?`Deload ${mesoOf(w)}`:(mesoOf(w)>1?`M${mesoOf(w)} `:"")+`W${posOf(w)}`;
const mesoLabel=w=>isDeload(w)?`Between Mesocycle ${mesoOf(w)} and ${mesoOf(w)+1}`:`Mesocycle ${mesoOf(w)}`;
let wkWeek=1, wkDay=(new Date().getDay()+6)%7, logs={}, lmem={};
const hasW=()=>db&&db.objectStoreNames.contains("w");
function wAll(){return new Promise(res=>{if(!hasW())return res(Object.values(lmem));const q=db.transaction("w").objectStore("w").getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})}
function wPut(o){logs[o.k]=o;return new Promise(res=>{if(!hasW()){lmem[o.k]=o;return res()}const q=db.transaction("w","readwrite").objectStore("w").put(o);q.onsuccess=q.onerror=()=>res()})}
async function loadLogs(){logs={};(await wAll()).forEach(o=>logs[o.k]=o);if(logs._meta)wkWeek=logs._meta.week||1}
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isNaN(n)?0:n};
function totals(){const pa=planAt(wkWeek),dn=pa.sess(wkDay);let sets=0,vol=0;
  pa.get(dn).x.forEach(s=>{const lg=logs[`${wkWeek}|${dn}|${s.split("|")[0]}`];if(lg)lg.sets.forEach(x=>{if(num(x.r)>0){sets++;vol+=num(x.w)*num(x.r)}})});
  return `${sets} sets logged · volume ${Math.round(vol)} kg`}
// Changes (swaps, set counts) apply from the week they are made in onward; earlier weeks keep their history.
const hist=k=>{const r=logs[k];if(!r)return [];return r.h||(r.name!=null?[{w:1,v:r.name}]:[])};
const atWeek=(k,w)=>{let v=null;hist(k).slice().sort((a,b)=>a.w-b.w).forEach(x=>{if(x.w<=w)v=x.v});return v};
const setFrom=(k,w,v)=>wPut({k,h:hist(k).filter(x=>x.w<w).concat({w,v})});
function renderWk(m){
  const pa=planAt(wkWeek),dn=pa.sess(wkDay),d=pa.get(dn),sid0=dn;
  let h=`<div class="wkbar"><button class="sm" id="wm">‹</button><div><b style="font-size:18px">${wkLabel(wkWeek)}</b><div class="sub">${mesoLabel(wkWeek)}</div></div><button class="sm" id="wp">›</button></div>
  <div class="chips">${DAYS.map((x,i)=>`<button class="chip ${i===wkDay?"on":""}" data-i="${i}">${x[0]+x.slice(1).toLowerCase()}</button>`).join("")}</div>
  <h2>${d.t}</h2>`;
  const dl=isDeload(wkWeek);
  if(dl)h+=`<div class="ex dlb"><b>Deload week</b><div class="meta">Recover before Mesocycle ${mesoOf(wkWeek)+1}. Do half the usual sets at about 50–60% of your normal weights, and stop well short of failure (RIR 4–5).</div></div>`;
  if(!d.x.length)h+=sid0==="REST"?`<div class="empty">Rest and recover</div>`:`<div class="empty">No exercises yet.<br>Add some in Settings → Edit exercises.</div>`;
  d.x.forEach(s=>{
    const e=s.split("|"),key=`${wkWeek}|${dn}|${e[0]}`,lg=logs[key]||{sets:[]},sk=`sets|${dn}|${e[0]}`,base=atWeek(sk,wkWeek)??+e[4],planned=dl?Math.max(1,Math.ceil(base/2)):base,n=Math.max(planned,lg.sets.length);
    const name=atWeek(`sub|${dn}|${e[0]}`,wkWeek)||e[1],sub=name!==e[1];
    let prev="";for(let w=wkWeek-1;w>=1&&!prev;w--){if(isDeload(w))continue;const p=logs[`${w}|${dn}|${e[0]}`];
      if(p&&(p.n||e[1])===name){const t=p.sets.filter(x=>num(x.r)>0).map(x=>`${x.w||0} kg × ${x.r}`).join(", ");if(t)prev=`Last time (${wkShort(w)}): ${t}`}}
    h+=`<div class="ex"><div class="exh"><h3>${esc(name)}</h3><button class="chip swap" data-d="${dn}" data-s="${e[0]}">Swap</button></div><div class="meta">${n} sets · ${e[5]} reps · RIR ${dl?"4–5":(e[7]||"3")} · Tempo ${e[2]} · Rest ${e[3]}</div>
    ${sub||!e[6]?"":`<div class="meta">${e[6]}</div>`}${prev?`<div class="hint">${prev}</div>`:""}`;
    for(let i=0;i<n;i++){const x=lg.sets[i]||{};
      h+=`<div class="set"><span>Set ${i+1}</span><input type="text" inputmode="decimal" placeholder="kg" data-k="${key}" data-i="${i}" data-f="w" data-nm="${esc(name)}" value="${x.w??""}"><b>×</b><input type="text" inputmode="numeric" placeholder="Reps" data-k="${key}" data-i="${i}" data-f="r" data-nm="${esc(name)}" value="${x.r??""}"></div>`}
    h+=(dl?"":`<button class="chip addset" data-sk="${sk}" data-n="${n}">+ Set</button>${n>1?`<button class="chip rmset" data-k="${key}" data-sk="${sk}" data-n="${n}">− Set</button>`:""}`)+`</div>`});
  if(d.x.length)h+=`<div class="ex"><b id="tot">${totals()}</b></div>`;
  m.innerHTML=h;
  $("#wm").onclick=()=>{wkWeek=Math.max(1,wkWeek-1);wPut({k:"_meta",week:wkWeek});render()};
  $("#wp").onclick=()=>{if(posOf(wkWeek)===MESO)return openDeload();if(isDeload(wkWeek))return openNewMeso();wkWeek++;wPut({k:"_meta",week:wkWeek});render()};
  m.querySelectorAll(".chip[data-i]").forEach(b=>b.onclick=()=>{wkDay=+b.dataset.i;render()});
  m.querySelectorAll("input[data-k]").forEach(el=>el.oninput=()=>{
    const k=el.dataset.k,i=+el.dataset.i,lg=logs[k]||{k,sets:[]};
    lg.sets=Array.from({length:Math.max(lg.sets.length,i+1)},(_,j)=>lg.sets[j]||{});
    lg.sets[i][el.dataset.f]=el.value;lg.n=el.dataset.nm;wPut(lg);const t=$("#tot");if(t)t.textContent=totals()});
  m.querySelectorAll(".addset").forEach(b=>b.onclick=async()=>{await setFrom(b.dataset.sk,wkWeek,+b.dataset.n+1);render()});
  m.querySelectorAll(".rmset").forEach(b=>b.onclick=async()=>{const n=+b.dataset.n-1,lg=logs[b.dataset.k];
    await setFrom(b.dataset.sk,wkWeek,n);if(lg&&lg.sets.length>n){lg.sets=lg.sets.slice(0,n);await wPut(lg)}render()});
  m.querySelectorAll(".swap").forEach(b=>b.onclick=()=>openSwap(b.dataset.d,b.dataset.s));
}

function openNewMeso(){
  const close=()=>$("#modal").classList.remove("on"),next=mesoOf(wkWeek)+1;
  $("#sheet").innerHTML=`<div class="shr"><button class="chip" id="back">‹ Back</button><h2>Start Mesocycle ${next}</h2></div>
  <p>Deload done. Would you like a new workout plan for the next ${MESO} weeks?</p>
  <div class="meta">Your past mesocycles keep the plan and history they had.</div>
  <div class="row"><button class="btn" id="nmn">Set up a new plan</button></div>
  <div class="row"><button class="btn alt" id="nmk">Keep my current plan</button></div>`;
  $("#modal").classList.add("on");
  $("#back").onclick=close;
  const advance=async()=>{for(let m=1;m<next;m++)if(!logs[`_hist|${m}`])await wPut({k:`_hist|${m}`,...snapPlan()});
    wkWeek++;await wPut({k:"_meta",week:wkWeek})};
  $("#nmk").onclick=async()=>{await advance();close();render()};
  $("#nmn").onclick=async()=>{await advance();
    close();flow="meso";draft=null;exDay=0;view="setup";render()};
}
function openDeload(){
  const close=()=>$("#modal").classList.remove("on"),m=mesoOf(wkWeek);
  $("#sheet").innerHTML=`<div class="shr"><button class="chip" id="back">‹ Back</button><h2>Mesocycle ${m} complete</h2></div>
  <p>You've finished all ${MESO} weeks. Take a <b>deload week</b> before starting Mesocycle ${m+1}.</p>
  <div class="meta">During the deload week you'll do half the usual sets at about 50–60% of your normal weights. It lets your body recover so you come back stronger.</div>
  <div class="row"><button class="btn" id="dgo">Start deload week</button></div>
  <div class="row"><button class="btn alt" id="dno">Stay on week ${MESO}</button></div>`;
  $("#modal").classList.add("on");
  $("#back").onclick=$("#dno").onclick=close;
  $("#dgo").onclick=()=>{wkWeek++;wPut({k:"_meta",week:wkWeek});close();render()};
}

// ---------- progress ----------
let progSel=null;
function progData(){
  const base={};DAYS.forEach(d=>PLAN[d].x.forEach(s=>{const e=s.split("|");base[`${d}|${e[0]}`]=e[1]}));
  const out={};
  for(const k in logs){const pr=k.split("|");if(pr.length!==3||pr[0]==="sub")continue;
    const w=+pr[0],lg=logs[k],nm=lg.n||base[`${pr[1]}|${pr[2]}`];if(!w||!nm||isDeload(w))continue;
    const ss=(lg.sets||[]).filter(x=>num(x.r)>0);if(!ss.length)continue;
    out[nm]=out[nm]||{};out[nm][w]=(out[nm][w]||[]).concat(ss)}
  return out}
function renderProg(m){
  const D=progData(),names=Object.keys(D).sort();
  if(!names.length){m.innerHTML=statsSeg()+`<div class="empty">Log some sets in the Workouts tab and your progress charts will appear here.</div>`;return}
  if(!names.includes(progSel))progSel=names[0];
  const pts=Object.keys(D[progSel]).map(Number).sort((a,b)=>a-b).map(w=>{const ss=D[progSel][w],vol=ss.reduce((a,x)=>a+num(x.w)*num(x.r),0);
    return{w,n:ss.length,vol,av:vol/ss.length}});
  const W=340,H=220,L=44,R=16,T=26,B=30,w0=pts[0].w,w1=pts[pts.length-1].w,K="av";
  const X=w=>pts.length===1?W/2:L+(w-w0)/(w1-w0)*(W-L-R);
  const vs=pts.map(p=>p[K]);let lo=Math.min(...vs),hi=Math.max(...vs);const pd=Math.max((hi-lo)*.2,hi===lo?1:0);lo-=pd;hi+=pd;
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),f=v=>Math.round(v*10)/10;
  let g="";
  for(let i=0;i<=2;i++){const y=T+i*(H-T-B)/2;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/>`}
  g+=`<text x="${L-6}" y="${T+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${Math.round(hi)}</text><text x="${L-6}" y="${H-B+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${Math.round(lo)}</text>`;
  const P=pts.map(p=>[X(p.w),Y(p[K])]);
  if(pts.length>1)g+=`<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" points="${P.map(q=>q.join(",")).join(" ")}"/>`;
  P.forEach((q,i)=>{g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4.5" fill="var(--accent)"/><text x="${q[0]}" y="${q[1]-10}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--text)">${Math.round(pts[i][K])}</text>`});
  pts.forEach(p=>{g+=`<text x="${X(p.w)}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${wkShort(p.w)}</text>`});
  const a=pts[0],z=pts[pts.length-1],dv=z[K]-a[K],pc=a[K]?Math.round(dv/a[K]*100):0;
  const arrow=v=>v>0?`<span style="color:#2fa84f">▲ ${Math.round(v)}</span>`:v<0?`<span style="color:var(--accent)">▼ ${Math.round(-v)}</span>`:`<span style="color:var(--muted)">–</span>`;
  let rows=`<div class="prow ph"><span>Week</span><span>Sets</span><span>Avg / set (kg)</span><span>Total (kg)</span></div>`;
  pts.forEach((p,i)=>{const q=pts[i-1];rows+=`<div class="prow"><span>${wkShort(p.w)}</span><span>${p.n}</span><span>${Math.round(p.av)} ${q?arrow(p.av-q.av):""}</span><span>${Math.round(p.vol)}</span></div>`});
  m.innerHTML=statsSeg()+`<label>Exercise</label><select id="ps">${names.map(n=>`<option value="${esc(n)}" ${n===progSel?"selected":""}>${esc(n)}</option>`).join("")}</select>
  <div class="ex" style="margin-top:12px"><div class="meta" style="margin-bottom:6px">Average volume moved per set (kg × reps)</div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>
  <div class="meta" style="margin-top:6px">${pts.length>1?`${Math.round(a[K])} → ${Math.round(z[K])} (${dv>0?"+":""}${Math.round(dv)}, ${pc>0?"+":""}${pc}%)`:"Log another week to see your trend."}</div></div>
  <div class="ex">${rows}</div>`;
  $("#ps").onchange=e=>{progSel=e.target.value;render()};
}

let bpDate=today();
function lineChart(es,series,unit){

  let lo=Math.min(...vs),hi=Math.max(...vs);const pd=Math.max((hi-lo)*.2,5);lo-=pd;hi+=pd;
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);let g="";
  for(let i=0;i<=2;i++){const y=T+i*(H-T-B)/2;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/>`}
  g+=`<text x="${L-6}" y="${T+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${Math.round(hi)}</text><text x="${L-6}" y="${H-B+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${Math.round(lo)}</text>`;
  series.forEach(s=>{const pts=es.filter(e=>e[s.k]).map(e=>[X(e),Y(e[s.k]),e[s.k]]);
    if(pts.length>1)g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(q=>q[0]+","+q[1]).join(" ")}"/>`;
    pts.forEach((q,i)=>{g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="${s.c}"/>`;if(i===pts.length-1)g+=`<text x="${q[0]}" y="${q[1]-8}" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--text)">${q[2]}</text>`})});
  g+=`<text x="${X(es[0])}" y="${H-10}" text-anchor="${es.length>1?"start":"middle"}" font-size="11" style="fill:var(--muted)">${fmt(es[0].d)}</text>`;
  if(es.length>1)g+=`<text x="${X(es[es.length-1])}" y="${H-10}" text-anchor="end" font-size="11" style="fill:var(--muted)">${fmt(es[es.length-1].d)}</text>`;
  return `<div class="lg">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.l}</span>`).join("")}<span style="color:var(--muted);font-weight:400">${unit}</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`}
function renderBp(m){
  const es=Object.keys(logs).filter(k=>k.startsWith("bp|")).map(k=>logs[k]).sort((a,b)=>a.d<b.d?-1:1);
  const cur=logs["bp|"+bpDate]||{},bpE=es.filter(e=>e.sys&&e.dia),hrE=es.filter(e=>e.hr);

    await wDel("bp|"+bpDate);bpDate=today();render()};

// ---------- water ----------
const localDay=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const waterGoal=()=>logs._water&&logs._water.goal||3000;
const litres=ml=>(Math.round(ml/50)/20).toLocaleString(undefined,{maximumFractionDigits:2})+" L";
function waterCard(){
  const k="water|"+localDay(),ml=logs[k]?logs[k].ml:0,g=waterGoal(),pc=Math.min(100,Math.round(ml/g*100));
  return `<div class="ex hwt"><div class="exh"><b>Water</b><span><b>${litres(ml)}</b> <span class="meta">of ${litres(g)} · ${pc}%</span></span></div>
  <div class="wbar"><div style="width:${pc}%"></div></div>
  <div class="wbtns"><button class="chip" data-ml="600">+600 ml</button><button class="chip" data-ml="1000">+1 L</button><button class="chip" id="wundo" ${ml?"":"disabled"}>Undo</button><button class="chip" id="wgoal">Goal</button></div></div>`}
async function setWaterGoal(v){const g=Math.round(Math.min(10,Math.max(0.25,num(v)||3))*1000);await wPut({k:"_water",goal:g});return g}
function openWaterGoal(){
  const close=()=>$("#modal").classList.remove("on");
  $("#sheet").innerHTML=`<div class="shr"><button class="chip" id="back">‹ Back</button><h2>Daily water goal</h2></div>
  <label>Goal (litres)</label><input type="text" inputmode="decimal" id="wgi" value="${waterGoal()/1000}" placeholder="e.g. 3.5">
  <div class="row"><button class="btn" id="wgs">Save</button></div>`;
  $("#modal").classList.add("on");setTimeout(()=>$("#wgi").focus(),50);
  $("#back").onclick=close;
  $("#wgs").onclick=async()=>{await setWaterGoal($("#wgi").value);close();render()};
}
function wireWater(m){
  const d=localDay(),k="water|"+d,rec=()=>logs[k]||{k,d,ml:0,adds:[]};
  m.querySelectorAll("[data-ml]").forEach(b=>b.onclick=async()=>{const r=rec(),n=+b.dataset.ml;
    await wPut({k,d,ml:r.ml+n,adds:[...(r.adds||[]),n]});render()});
  const u=m.querySelector("#wundo");if(u)u.onclick=async()=>{const r=rec(),adds=[...(r.adds||[])],last=adds.pop()||r.ml;
    await wPut({k,d,ml:Math.max(0,r.ml-last),adds});render()};
  const g=m.querySelector("#wgoal");if(g)g.onclick=openWaterGoal;
}

// ---------- backup & restore ----------
const lastBackup=()=>logs._backup?"Last backup: "+new Date(logs._backup.t).toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}):"No backup yet.";
async function backup(){
  const msg=$("#bkmsg");msg.textContent="Preparing backup…";
  try{
    await wPut({k:"_backup",t:Date.now()});
    const data={app:"physiq",version:1,created:new Date().toISOString(),photos:await pAll(),logs:await wAll()};
    const name="physiq-backup-"+localDay()+".json",file=new File([JSON.stringify(data)],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:"Physiq backup"})}catch(e){if(e.name==="AbortError"){msg.textContent="Backup cancelled.";return}throw e}
    }else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
    msg.textContent=lastBackup()+" · "+data.photos.length+" photos saved. Choose “Save to Files” if asked.";
  }catch(e){msg.textContent="Backup failed. Please try again."}
}
function clearStore(name){return new Promise(res=>{if(!db||!db.objectStoreNames.contains(name)){if(name==="p")mem=[];else lmem={};return res()}const q=db.transaction(name,"readwrite").objectStore(name).clear();q.onsuccess=q.onerror=()=>res()})}
$("#rfile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const msg=$("#bkmsg");let data;
  try{data=JSON.parse(await f.text())}catch(err){data=null}
  if(!data||data.app!=="physiq"||!Array.isArray(data.photos)||!Array.isArray(data.logs)){if(msg)msg.textContent="That file isn’t a Physiq backup.";return}
  const when=data.created?new Date(data.created).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"unknown date";
  $("#sheet").innerHTML=`<div class="shr"><button class="chip" id="back">‹ Back</button><h2>Restore backup?</h2></div>
  <div class="meta">Backup from ${when}: ${data.photos.length} photos and ${data.logs.length} saved entries.</div>
  <p style="color:var(--accent);font-weight:600">This replaces everything currently in the app on this phone.</p>
  <div class="row"><button class="btn" id="rgo">Restore</button></div>`;
  $("#modal").classList.add("on");
  const close=()=>$("#modal").classList.remove("on");
  $("#back").onclick=close;
  $("#rgo").onclick=async()=>{$("#rgo").disabled=true;$("#rgo").textContent="Restoring…";
    await clearStore("p");await clearStore("w");
    for(const p of data.photos)if(p&&p.id!=null)await pPut(p);
    for(const o of data.logs)if(o&&o.k!=null)await wPut(o);
    close();location.reload()};
};

let camStream=null,camShot=null,camTimerId=null;
const camPrefs=()=>logs._cam||{k:"_cam",facing:"user",timer:0,ghost:0};
function camUI(){const c=camPrefs(),g=photos.slice().reverse();
  $("#cbox").classList.toggle("mir",c.facing==="user");
  $("#ctimer").textContent=c.timer?`Timer ${c.timer}s`:"Timer off";$("#ctimer").classList.toggle("on",!!c.timer);
  const gp=c.ghost>0?g[c.ghost-1]:null;
  $("#cghost").textContent=gp?`Ghost: ${gp.label||fmt(gp.date)}`:"Ghost off";$("#cghost").classList.toggle("on",!!gp);
  $("#cghost").disabled=!g.length;
  const gi=$("#cgh");if(gp){gi.src=urlOf(gp);gi.hidden=false}else{gi.hidden=true;gi.removeAttribute("src")}}
async function camStart(){
  if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;
  try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camPrefs().facing,width:{ideal:1440},height:{ideal:1920}},audio:false});
    $("#cvid").srcObject=camStream;await $("#cvid").play().catch(()=>{})}
  catch(err){camClose();alert("The camera isn’t available. Allow camera access for this site in Settings → Safari → Camera, or use Add from library.")}}
async function openCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert("This browser can’t open the camera inside the app. Use Add from library instead.");return}
  const c=camPrefs();if(c.ghost===0&&photos.length&&!logs._cam)c.ghost=1;logs._cam=c;
  camShot=null;$("#cprev").hidden=true;$("#cvid").hidden=false;$("#cbot").hidden=false;$("#cdone").hidden=true;$("#ccount").textContent="";$("#cshot").disabled=false;
  $("#cam").hidden=false;camUI();await camStart()}
function camClose(){clearInterval(camTimerId);if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;$("#cam").hidden=true;$("#cvid").srcObject=null}
function camCapture(){const v=$("#cvid"),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return;
  let sw=vw,sh=vh,sx=0,sy=0;if(vw/vh>3/4){sw=vh*3/4;sx=(vw-sw)/2}else{sh=vw*4/3;sy=(vh-sh)/2}
  const W=Math.min(1200,Math.round(sw)),H=Math.round(W*4/3),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  if(camPrefs().facing==="user"){x.translate(W,0);x.scale(-1,1)}
  x.drawImage(v,sx,sy,sw,sh,0,0,W,H);camShot=c.toDataURL("image/jpeg",.85);
  const pv=$("#cprev");pv.src=camShot;pv.hidden=false;$("#cbox").classList.remove("mir");v.hidden=true;$("#cgh").hidden=true;
  $("#cbot").hidden=true;$("#cdone").hidden=false}
$("#cx").onclick=camClose;
$("#cflip").onclick=async()=>{const c=camPrefs();c.facing=c.facing==="user"?"environment":"user";await wPut(c);camUI();await camStart()};
$("#ctimer").onclick=async()=>{const c=camPrefs();c.timer=c.timer===0?3:c.timer===3?10:0;await wPut(c);camUI()};
$("#cghost").onclick=async()=>{const c=camPrefs(),n=Math.min(photos.length,5);c.ghost=n?(c.ghost+1)%(n+1):0;await wPut(c);camUI()};
$("#cshot").onclick=()=>{const t=camPrefs().timer;if(!t)return camCapture();
  let n=t;$("#cshot").disabled=true;$("#ccount").textContent=n;
  camTimerId=setInterval(()=>{n--;if(n>0){$("#ccount").textContent=n;return}clearInterval(camTimerId);$("#ccount").textContent="";$("#cshot").disabled=false;camCapture()},1000)};
$("#cre").onclick=()=>{camShot=null;$("#cprev").hidden=true;$("#cvid").hidden=false;$("#cbot").hidden=false;$("#cdone").hidden=true;camUI()};
$("#csave").onclick=async()=>{if(!camShot)return;const n=photos.length+1;
  await pPut({id:Date.now(),date:localDay(),label:"Week "+n,data:camShot});camClose();view="gal";await load()};

$("#file").onchange=async e=>{
  const files=[...e.target.files];e.target.value="";
  let n=photos.length;
  for(const f of files){
    try{const data=await shrink(f);n++;
      const d=f.lastModified?new Date(f.lastModified).toISOString().slice(0,10):today();
      await pPut({id:Date.now()+n,date:d,label:"Week "+n,data});
    }catch(err){console.error("add failed")}
  }
  load();
};

// ---------- offline support + persistence ----------
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
openDB().then(async()=>{await loadLogs();if(logs._sched)sched=logs._sched.s;applyPlan();view="home";await load();
  if(!logs._onb&&!logs._sched&&!Object.keys(logs).some(k=>/^\d+\|/.test(k)))openWelcome()});
</script>
